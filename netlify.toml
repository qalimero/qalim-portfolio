[build]
  base    = "front"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Root → maintenance redirect (HTTP 301, faster than Astro's HTML meta-refresh)
[[redirects]]
  from   = "/"
  to     = "/maintenance"
  status = 301

[[redirects]]
  from   = "/terminal"
  to     = "/home"
  status = 301

# Cache immutable hashed assets (_astro/ chunk files)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers on all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options              = "nosniff"
    X-Frame-Options                     = "DENY"
    X-XSS-Protection                    = "1; mode=block"
    Referrer-Policy                     = "strict-origin-when-cross-origin"
    Permissions-Policy                  = "geolocation=(), microphone=(), camera=()"
